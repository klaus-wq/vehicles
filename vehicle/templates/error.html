{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5 min-vh-100 d-flex align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-lg-6 text-center">

            <h1 class="display-1 fw-bold text-danger">{{ status }}</h1>
            <h2 class="mb-4">{{ error_message }}</h2>

            <div class="alert alert-danger">
                <p class="lead mb-3">
                    {{ error_message }}
                </p>
<!--                <p>-->
<!--                    {% if user.is_authenticated %}-->
<!--                        Возможно, ваш аккаунт не привязан к предприятиям.<br>-->
<!--                        Обратитесь к администратору.-->
<!--                    {% else %}-->
<!--                        Пожалуйста, <a href="{% url 'login' %}">войдите в систему</a>.-->
<!--                    {% endif %}-->
<!--                </p>-->
            </div>

            <div class="mt-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger me-3">Выйти</a>
                {% endif %}
                <a href="/" class="btn btn-primary">На главную</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
